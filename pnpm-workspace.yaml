packages:
  # The upstream harness, vendored as a git submodule pinned to a known
  # commit (see packages/_vendor/deepseek-harness's own pin) so `workspace:^`
  # dependencies on @deepseek-ai/dsh-* and @deepseek-ai/cordis resolve
  # against real upstream sources — @deepseek-ai/dsh-* is not published to
  # npm, only @deepseek-ai/cordis is. Nested under packages/ rather than a
  # sibling vendor/ directory: dsh-typert-generator's workspace-mode analysis
  # only registers a package whose real path resolves under
  # <root>/packages/, a deepseek-harness-internal-layout assumption baked
  # into dsh-typert-protocol recognition (see ARCHITECTURE.md).
  - packages/_vendor/deepseek-harness/vendor/*
  - packages/_vendor/deepseek-harness/packages/*/*
  - packages/_vendor/deepseek-harness/native/system
  - packages/_vendor/deepseek-harness/native/system/packages/*
  # Two warnings on a fresh `pnpm install` come from the vendored harness and
  # are expected — don't try to "fix" them here, and never by editing vendor:
  #   * "Unsupported platform" for the @deepseek-ai/node-addon-system-*
  #     prebuild packages that don't match the host. Each is declared
  #     os/cpu-restricted and consumed as an optionalDependency, so skipping
  #     the non-host ones is the intended behaviour.
  #     They still have to stay in this glob: the entry package depends on
  #     them with `workspace:*`, which only resolves against a workspace
  #     member, so dropping them here breaks the install outright.
  #     (pnpm's supportedArchitectures does not silence this — that setting
  #     only selects registry optional deps, not a workspace project's own
  #     os/cpu self-check.)
  #     This tier was `native/landlock-run` until upstream renamed it to
  #     `native/system` and broadened it past the Landlock launcher into the
  #     node-addon-system native addon (darwin prebuilds now ship too); mirror
  #     the vendored pnpm-workspace.yaml's own globs when it moves again.
  #   * "There are cyclic workspace dependencies" among the vendored
  #     dsh-* packages. Upstream's own graph; nothing in this repo creates it.
  - packages/_vendor/deepseek-harness/apps/*
  # Not consumed by this repo's plugins, but the vendored tsconfig.host.json
  # typechecks benchmarks/** and website/** as part of its own build aggregate,
  # so `build:vendor` fails on their unresolved imports (e.g. playwright) unless
  # their dependencies install. Present purely to keep the vendor buildable.
  - packages/_vendor/deepseek-harness/benchmarks
  - packages/_vendor/deepseek-harness/website
  - packages/_vendor/deepseek-harness/python/sdk-runtime

  # This repo's own plugin bundles, grouped by feature. `workspace-git`'s
  # bare group root (no dependencies of its own) carries only a `build`
  # script that builds every package in its group in the correct
  # host-before-client order — see that package.json's own description.
  - packages/workspace-git
  - packages/workspace-git/*
  - packages/anthropic-subscription
  - packages/anthropic-subscription/*
  - packages/terminal/*
  - packages/mcp-connector
  - packages/mcp-connector/*
  - packages/web-search-webcli

# Mirrors deepseek-ai/deepseek-harness's own allowBuilds policy (pnpm 10+
# denies any dependency's install/build script until explicitly reviewed
# here). esbuild and node-pty/koffi are genuine native-build needs pulled in
# transitively from the vendored harness; @google/genai and protobufjs ship
# no-op lifecycle scripts we don't need.
allowBuilds:
  esbuild: true
  node-pty: true
  koffi: true
  '@google/genai': false
  protobufjs: false
  # Both mirror upstream's own denial. electron-builder pulls in the optional
  # Squirrel.Windows helper, whose install script only selects its bundled
  # 7-Zip executable; Desktop ships Windows through NSIS, so that mutation is
  # not part of our build. msgpackr-extract's native accelerator is unneeded —
  # store-index rewriting only uses msgpackr's portable JavaScript codec.
  electron-winstaller: false
  msgpackr-extract: false
  # Same package as vendor's own '@deepseek-ai/dsh-subprocess-local@file:
  # packages/subprocess/subprocess-local' entry (packages/_vendor/deepseek-
  # harness/pnpm-workspace.yaml) — restores node-pty's macOS spawn helper's
  # executable bit. Reviewed there already; this entry exists only because
  # pnpm computes the file: key relative to *this* workspace root, so the
  # same package resolves to a different key string here than inside vendor's
  # own nested workspace (surfaced by `pnpm --filter=@deepseek-ai/dsh deploy`,
  # which operates against this outer workspace's graph).
  '@deepseek-ai/dsh-subprocess-local@file:packages/_vendor/deepseek-harness/packages/subprocess/subprocess-local': true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/libreoffice-kit-darwin-arm64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-darwin-x64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-wasm@0.1.1'
  - '@deepseek-ai/libreoffice-kit-win32-arm64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-win32-x64@0.1.1'
  - '@deepseek-ai/libreoffice-kit@0.1.1'

overrides:
  '@deepseek-ai/cosmokit': 'link:packages/_vendor/deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:packages/_vendor/deepseek-harness/vendor/schemastery'
  # Pinned to the exact version packages/_vendor/deepseek-harness's own
  # committed pnpm-lock.yaml resolves. A workspace-wide `pnpm install` here
  # otherwise re-resolves the newest version satisfying vendored packages'
  # own `^0.84.2` range, which can drift ahead of what the vendored source
  # was written and tested against (e.g. 0.84.4 adds catalog.ts fields the
  # pinned commit's drift gates don't classify yet) — never fix that by
  # editing vendor source; re-pin here to match the vendor's own lockfile.
  '@earendil-works/pi-ai': '0.85.1'
  # Same drift-pin rationale as '@earendil-works/pi-ai' above: every package
  # (vendor's and this repo's own) declares "zod": "^4.4.3", and vendor's own
  # committed lockfile resolves that range to 4.4.3 everywhere, but a
  # workspace-wide `pnpm install` here re-resolves it against whatever is
  # newest on the registry at install time (4.5.4 as of this pin), producing
  # two zod copies whose exact-optional-property-types structural types
  # collide (packages/experimental/browser-use-stagehand-native's own
  # `z.ZodType` parameter, most concretely) — `dsh-typert-loader`'s own `'_zod'
  # in schema` structural check elsewhere in this codebase exists precisely
  # because two same-named-but-different zod copies are otherwise
  # indistinguishable at the type level until they collide like this.
  zod: '4.4.3'
  # Same drift-pin rationale again: root and vendor both declare "vitest":
  # "^4.1.8", but a workspace-wide `pnpm install` re-resolves it (and its
  # @vitest/* siblings, versioned in lockstep with it) to whatever is newest
  # on the registry (4.1.11 as of this pin) instead of reusing vendor's own
  # committed 4.1.8 resolution — two copies of vitest's own internal
  # `MatcherState`/`TestContext` types then collide under
  # `exactOptionalPropertyTypes: true` while typechecking `benchmarks`
  # (folded into `tsconfig.host.json` — see ARCHITECTURE.md's "Dependency
  # source").
  vitest: '4.1.8'
  '@vitest/coverage-v8': '4.1.8'
  '@vitest/expect': '4.1.8'
  '@vitest/mocker': '4.1.8'
  '@vitest/pretty-format': '4.1.8'
  '@vitest/runner': '4.1.8'
  '@vitest/snapshot': '4.1.8'
  '@vitest/spy': '4.1.8'
  '@vitest/utils': '4.1.8'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# `packageManager` in the root package.json pins pnpm to an exact version, so
# pnpm's "Update available!" banner advertises an upgrade we can never take by
# just running it — moving off the pin is a deliberate, separate change (it can
# re-resolve the lockfile, which the overrides above exist to keep stable).
# Silence the nag rather than let it train us to ignore install output.
updateNotifier: false
