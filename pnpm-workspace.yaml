packages:
  # The upstream harness, vendored as a git submodule pinned to a known
  # commit (see packages/_vendor/deepseek-harness's own pin) so `workspace:^`
  # dependencies on @deepseek-ai/dsh-* and @deepseek-ai/cordis resolve
  # against real upstream sources — @deepseek-ai/dsh-* is not published to
  # npm, only @deepseek-ai/cordis is. Nested under packages/ rather than a
  # sibling vendor/ directory: dsh-typert-generator's workspace-mode analysis
  # only registers a package whose real path resolves under
  # <root>/packages/, a deepseek-harness-internal-layout assumption baked
  # into dsh-typert-protocol recognition (see ARCHITECTURE.md).
  - packages/_vendor/deepseek-harness/vendor/*
  - packages/_vendor/deepseek-harness/packages/*/*
  - packages/_vendor/deepseek-harness/native/landlock-run
  - packages/_vendor/deepseek-harness/native/landlock-run/packages/*
  # Two warnings on a fresh `pnpm install` come from the vendored harness and
  # are expected — don't try to "fix" them here, and never by editing vendor:
  #   * "Unsupported platform" for landlock-run's linux-arm64/linux-x64
  #     packages when installing on macOS or Windows. They are Linux-only
  #     prebuilt sandbox binaries, declared os/cpu-restricted and consumed as
  #     optionalDependencies, so skipping them is the intended behaviour.
  #     They still have to stay in this glob: the entry package depends on
  #     them with `workspace:*`, which only resolves against a workspace
  #     member, so dropping them here breaks the install outright.
  #     (pnpm's supportedArchitectures does not silence this — that setting
  #     only selects registry optional deps, not a workspace project's own
  #     os/cpu self-check.)
  #   * "There are cyclic workspace dependencies" among the vendored
  #     dsh-* packages. Upstream's own graph; nothing in this repo creates it.
  - packages/_vendor/deepseek-harness/apps/*

  # This repo's own plugin bundles, grouped by feature. `workspace-git`'s
  # bare group root (no dependencies of its own) carries only a `build`
  # script that builds every package in its group in the correct
  # host-before-client order — see that package.json's own description.
  - packages/workspace-git
  - packages/workspace-git/*
  - packages/anthropic-subscription
  - packages/anthropic-subscription/*
  - packages/terminal/*

# Mirrors deepseek-ai/deepseek-harness's own allowBuilds policy (pnpm 10+
# denies any dependency's install/build script until explicitly reviewed
# here). esbuild and node-pty/koffi are genuine native-build needs pulled in
# transitively from the vendored harness; @google/genai and protobufjs ship
# no-op lifecycle scripts we don't need.
allowBuilds:
  esbuild: true
  node-pty: true
  koffi: true
  '@google/genai': false
  protobufjs: false

linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:packages/_vendor/deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:packages/_vendor/deepseek-harness/vendor/schemastery'
  # Pinned to the exact version packages/_vendor/deepseek-harness's own
  # committed pnpm-lock.yaml resolves. A workspace-wide `pnpm install` here
  # otherwise re-resolves the newest version satisfying vendored packages'
  # own `^0.84.2` range, which can drift ahead of what the vendored source
  # was written and tested against (e.g. 0.84.4 adds catalog.ts fields the
  # pinned commit's drift gates don't classify yet) — never fix that by
  # editing vendor source; re-pin here to match the vendor's own lockfile.
  '@earendil-works/pi-ai': '0.84.2'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# `packageManager` in the root package.json pins pnpm to an exact version, so
# pnpm's "Update available!" banner advertises an upgrade we can never take by
# just running it — moving off the pin is a deliberate, separate change (it can
# re-resolve the lockfile, which the overrides above exist to keep stable).
# Silence the nag rather than let it train us to ignore install output.
updateNotifier: false
