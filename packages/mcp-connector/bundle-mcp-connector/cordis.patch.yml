# Adds MCP connectors — including remote servers behind OAuth 2.0 — to a
# web-app-derived profile.
#
# Nothing here disables a vendor row. `settings.section` is a pristine
# `kind: 'list'` slot that @deepseek-ai/dsh-client-ui-settings declares for
# exactly this purpose, so the Settings page below is an additive
# registration, not a replacement — unlike this repo's ui-workspace,
# ui-conversation, and ui-settings-models rows, this bundle has no
# replacement-parity obligation at all (see ../../../ARCHITECTURE.md's
# "Replacement parity").
#
# authorization-seam: gone as of vendor pin 477b4f42, which is the case the
# previous comment here named — "if a future dsh-base ships this row itself,
# drop both operations". packages/bundle/base/cordis.patch.yml now mounts
# @deepseek-ai/dsh-authorization as its own `authorization` row, so the
# disable-then-reinsert pair this bundle used to carry became a second mount
# of one service name: a hard Cordis conflict that left the seam inactive and
# took OAuth sign-in down with it. The seam is still required and still
# present — it is simply the base bundle's row now, not ours.
#
# mcp-connector: owns the `mcp-connector` settings section and mounts one
# dsh-plugins-mcp-client-oauth instance per enabled connector. Connectors are
# reconciled live, so one added from the Settings page or the CLI is mounted
# without a restart.
#
# The row id is load-bearing and must stay `mcp-connector`. Since vendor pin
# 477b4f42 a settings section is addressed by the *profile entry id* that owns
# it — `ctx.settings.replace(ns, …)` resolves `ns` against `entry.options.id`,
# and there is no longer a `register(namespace, …)` call that could name it
# something else. The same id is what the vendor's one-time import of a
# pre-0.1.7 `$DSH_HOME/settings.yaml` looks for: it moves each section into the
# entry whose id matches the section name, so an id of `mcp-connector-registry`
# (what this row was called before the pin bump) would strand every configured
# connector in the renamed `settings.yaml.imported` instead of migrating it.
#
# mcp-connector-controller: the `mcpConnectors` Remote namespace, discovered
# by @deepseek-ai/dsh-typert-loader (part of every dsh-base-derived profile:
# web, headless, acp, sdk — install this layer into one of those, not
# sdk-minimal).
#
# mcp-oauth-callback: receives an authorization redirect on the web server at
# /mcp-oauth/callback, for a browser that cannot reach the host's loopback
# listener — the Settings page opened from another machine, or a dsh reached
# over SSH. It publishes its sink unconditionally and registers the route only
# once a webServer exists, so it is harmless in a profile that serves no UI.
#
# remotes-mcp-connector mounts that namespace's generated Client contribution
# — the role @deepseek-ai/dsh-api-remotes fills for every in-tree namespace
# but cannot for an out-of-tree one. Kept as its own dedicated plugin, not
# folded into the Settings UI row below: a $mount failure there would throw
# that plugin's whole apply() and take down everything else it renders.
#
# ui-settings-mcp-connector: the Settings > MCP connectors page.

- insert:
    - id: mcp-connector
      name: 'dsh-plugins-mcp-connector-registry'

    - id: mcp-connector-controller
      name: 'dsh-plugins-api-mcp-connector-controller'

    - id: mcp-oauth-callback
      name: 'dsh-plugins-host-oauth-callback-mcp-connector'

    - id: remotes-mcp-connector
      name: 'dsh-plugins-client-remotes-mcp-connector'

    - id: ui-settings-mcp-connector
      name: 'dsh-plugins-client-ui-settings-mcp-connector'
