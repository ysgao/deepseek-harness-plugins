# Adds the generic ctx.authorization RPC controller as an independent
# top-level plugin — not nested inside @deepseek-ai/dsh-api-settings-controller
# the way yga/deepseek-harness's fork mounted it, which is what made it
# impossible to install without editing that package. Requires
# @deepseek-ai/dsh-typert-loader, part of every dsh-base-derived profile
# (web, headless, acp, sdk); install this layer into one of those, not
# sdk-minimal.
#
# Also mounts @deepseek-ai/dsh-authorization itself: confirmed against a
# pristine deepseek-ai/deepseek-harness checkout that no shipped bundle
# mounts this seam by default (yga/deepseek-harness's own base bundle does
# — that's a fork-only addition, not upstream). Booting without it leaves
# this row (and dsh-llm-pi-ai's dormant flow registration) waiting forever
# on a service nothing provides. If a future dsh-base starts shipping this
# row itself, drop this insert — a duplicate mount of the same service
# conflicts.
#
# dsh-llm-pi-ai (already part of dsh-base) registers a dormant
# ctx.authorization flow per installed pi-ai catalog provider — Anthropic
# included — the moment ctx.authorization exists in the composition; this
# layer only adds the RPC surface a client uses to list/drive those flows.
#
# remotes-anthropic-subscription mounts this bundle's own authorization
# generated Remote contribution on the Client — the role
# @deepseek-ai/dsh-api-remotes fills for every other namespace, but can't
# for this out-of-tree one (see that package's own README). Kept as its own
# dedicated plugin, not folded into the Settings UI consumer below: a
# $mount failure there would throw that plugin's whole apply() and take
# down everything else it renders. This row's own failure stays local to
# its own fiber instead.
#
# ui-settings-models (disabled) / ui-settings-anthropic-subscription
# (inserted in its place): the Settings > Models sign-in panel. Neither of
# that package's own extension slots (settings.models.provider-card/footer)
# reaches inside ProviderEditor's own card body, so — same as workspace-git's
# ui-workspace/ui-conversation replacements — the only options were a vendor
# patch (forbidden) or a full replacement: "unplug the original plugin row,
# plug in an enhanced one" (see ../../../ARCHITECTURE.md's "Why replace the
# plugin instead of patching it"). `id: ui-settings-models` matches the row
# name the vendored packages/bundle/web-app/cordis.patch.yml uses; this
# bundle therefore requires installing into a web-app-derived profile after
# @deepseek-ai/dsh-web-app itself (cordis.patch.yml operations apply in
# bundle-list order — installing this bundle first leaves nothing to
# disable, a harmless no-op warning, not an error, same as workspace-git's
# own documented install-order requirement).

- insert:
    - id: authorization-seam
      name: '@deepseek-ai/dsh-authorization'

    - id: authorization-controller
      name: 'dsh-plugins-api-authorization-controller'

    - id: remotes-anthropic-subscription
      name: 'dsh-plugins-client-remotes-anthropic-subscription'

- id: ui-settings-models
  disabled: true

- insert:
    - id: ui-settings-anthropic-subscription
      name: 'dsh-plugins-client-ui-settings-anthropic-subscription'
