# A standalone application layer over dsh-base — dsh --profile <name> owns
# no task-positional parser (unlike dsh-headless), so the login command's
# own argument grammar cannot race one. See README.md for why.
#
# Also mounts @deepseek-ai/dsh-authorization itself: confirmed against a
# pristine deepseek-ai/deepseek-harness checkout that no shipped bundle
# mounts this seam by default (yga/deepseek-harness's own base bundle does
# — that's a fork-only addition, not upstream). Without it this row waits
# forever on a service nothing provides. If a future dsh-base starts
# shipping this row itself, drop this insert — a duplicate mount of the
# same service conflicts.

- insert:
    - id: authorization-seam
      name: '@deepseek-ai/dsh-authorization'

    - id: cli-login-runner
      name: 'dsh-plugins-cli-login-app'
