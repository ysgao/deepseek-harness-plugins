# A standalone application layer over dsh-base — dsh --profile <name> owns
# no task-positional parser (unlike dsh-headless), so the login command's
# own argument grammar cannot race one. See README.md for why.
#
# No longer mounts @deepseek-ai/dsh-authorization itself: this is the case the
# previous comment named — as of vendor pin 477b4f42 dsh-base ships that seam
# as its own `authorization` row, and inserting it here too was a duplicate
# mount of one service name, which conflicts. The seam this row needs is
# still there; it is the base bundle's now.

- insert:
    - id: cli-login-runner
      name: 'dsh-plugins-cli-login-app'
