# Composes the File manager + git feature into a web-app-derived profile:
# the two Host Typert controllers (workspace-files/workspace-git RPC
# namespaces) plus three Client packages, over the profile's existing
# base/web-app composition — no edit to packages/bundle/base or
# packages/bundle/web-app in the vendored harness (one row below disables
# an existing one; nothing here rewrites vendored source).
#
# No workspace-registry-seam row here, unlike dsh-plugins-bundle-anthropic-
# subscription's own authorization-seam: that one is needed because no
# shipped bundle mounts @deepseek-ai/dsh-authorization by default anywhere.
# @deepseek-ai/dsh-workspace is different — confirmed against a pristine
# deepseek-ai/deepseek-harness checkout that the web-app bundle always
# mounts it (id: workspace; headless/acp/sdk profiles have no Workspace
# concept at all — there's no sidebar to browse, and this bundle's own
# Client packages below are themselves Workspace-sidebar UI, meaningless
# without one). Both Host controllers below declare `static inject =
# ['workspaceRegistry']`, resolved by web-app's own row — this file's own
# header and README already require installing into a web-app-derived
# profile, which makes self-mounting it here a guaranteed duplicate
# registration (`service "workspaceRegistry" has been registered`), not a
# self-sufficiency win. Reproduced directly: EntryGroup.create (vendor/
# loader/src/config/group.ts) activates every entry in a layer through
# `Promise.allSettled`, concurrently and with no ordering guarantee against
# web-app's own `workspace` row, so a `disabled: !!js ctx.get(...)`
# conditional guard would only be a race, not a fix — dropping the row is
# the only deterministic one.
#
# conversation-files mounts into dsh-client-ui-conversation's pristine
# conversation.view slot — a real, working File tab, no upstream diff
# needed for the tab itself.
#
# conversation-enhanced is what makes that tab reachable from OUTSIDE the
# current session's own render tree (the sidebar Files tree, any session):
# the conversationFileOpener cross-session bridge. Like workspace-enhanced
# below, it does NOT patch dsh-client-ui-conversation — it's a full
# replacement for that package's own conversation-shell registration ("unplug
# the original plugin row, plug in an enhanced one" — see ARCHITECTURE.md's
# "File tab: a pristine slot, but a fork-only trigger" and
# dsh-plugins-client-ui-conversation-enhanced's own README), which is why
# the `disabled: true` row below turns the original off first: both packages
# registering the same conversation slots at once conflicts. `id:
# ui-conversation` matches the row name the vendored
# packages/bundle/web-app/cordis.patch.yml uses; confirm that id still
# matches if the submodule pin ever moves and this row starts failing to
# find anything to disable.
#
# workspace-files-node provides the optional workspaceFilesNode Context
# service; workspace-enhanced is what actually consumes it and renders the
# Files sibling row. workspace-enhanced does NOT patch dsh-client-ui-
# workspace — it's a full replacement for that package's own
# sidebar.workspaces/conversation.hero.workspace registrations ("unplug the
# original plugin row, plug in an enhanced one" — see ARCHITECTURE.md and
# dsh-plugins-client-ui-workspace-enhanced's own README), which is why the
# `disabled: true` row below turns the original off first: both packages
# registering the same slot at once conflicts. `id: ui-workspace` matches
# the row name the vendored packages/bundle/web-app/cordis.patch.yml uses;
# confirm that id still matches if the submodule pin ever moves and this
# row starts failing to find anything to disable.
#
# remotes-workspace-git mounts this bundle's own workspace-files/workspace-
# git generated Remote contributions on the Client — the role
# @deepseek-ai/dsh-api-remotes fills for every other namespace, but can't
# for these two out-of-tree ones (see that package's own README). Kept as
# its own dedicated plugin, not folded into workspace-enhanced: a $mount
# failure there would throw workspace-enhanced's whole apply() and take the
# core Workspace sidebar down with it. This row's own failure stays local to
# its own fiber instead — workspace-files-node/conversation-files simply
# stay pending on their `remote.workspace-files`/`remote.workspace-git`
# inject if it never mounts, degrading only the Files/git-status feature.

- id: ui-workspace
  disabled: true

- id: ui-conversation
  disabled: true

- insert:
    - id: workspace-file-controller
      name: 'dsh-plugins-api-workspace-file-controller'

    - id: workspace-git-controller
      name: 'dsh-plugins-api-workspace-git-controller'

    - id: conversation-enhanced
      name: 'dsh-plugins-client-ui-conversation-enhanced'

    - id: conversation-files
      name: 'dsh-plugins-client-ui-conversation-files'

    - id: workspace-files-node
      name: 'dsh-plugins-client-ui-workspace-files'

    - id: workspace-enhanced
      name: 'dsh-plugins-client-ui-workspace-enhanced'

    - id: remotes-workspace-git
      name: 'dsh-plugins-client-remotes-workspace-git'
